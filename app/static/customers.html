<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳場 — 顧客カード</title>
<!-- v184: 旧・簡易編集ページを廃し、LIFFカードと同内容の「閲覧ビュー」に全面刷新(本人裁定: 閲覧のみ完全同等)。
     編集はLIFF(LINEの帳場くん)に誘導。データは /api/web/contacts と /api/web/contact/{code}(玄関Cookie認証)。 -->
<style>
:root{
  color-scheme:light dark;
  --bg:#F7F5EF; --panel:#FFFFFF; --border:#E6E1D4; --text:#2B2823; --sub:#6B6455;
  --navy:#1B2A4A; --gold:#A8842F; --green:#0E7A4D; --red:#C0402C;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1a1a19; --panel:#242422; --border:#3A3833; --text:#f2f0e9; --sub:#a8a599;
    --navy:#8FA3CC; --gold:#D4B25F; --green:#3fae7a; --red:#e06552;}
}
*{box-sizing:border-box;margin:0}
body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.6;padding-bottom:40px}
header{background:var(--navy);color:#F0ECE2;padding:13px 18px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:5}
header h1{font-size:16px}
header .sub{font-size:11px;opacity:.75}
main{max-width:1100px;margin:14px auto;padding:0 14px;display:grid;gap:14px;grid-template-columns:300px 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}
  #listPane.hidden{display:none} #detailPane.hidden{display:none}}
.pane{min-width:0}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:15px;margin-bottom:8px}
.kchips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.kchip{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:5px 12px;cursor:pointer;
  background:var(--panel);color:var(--sub)}
.kchip.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.row{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;
  margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.row:hover{border-color:var(--gold)}
.row.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.row .nm{font-weight:700}
.row .mt{font-size:11px;color:var(--sub)}
.rk{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:auto}
.rk.S{background:var(--gold);color:#fff}.rk.A{background:#8a7c5e;color:#fff}
.rk.B{background:var(--border);color:var(--sub)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;color:var(--sub);margin-bottom:8px}
.kv{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{flex:0 0 108px;color:var(--sub);font-size:12px}
.kv .v{flex:1;min-width:0;overflow-wrap:anywhere}
.pill{border-radius:10px;padding:8px 12px;font-size:13px;margin:4px 0;border:1px solid var(--border)}
.pill.green{border-color:var(--green);color:var(--green)}
.pill.red{border-color:var(--red);color:var(--red)}
.pill.gold{border-color:var(--gold);color:var(--gold)}
.quote{font-size:11.5px;color:var(--sub);border-left:3px solid var(--border);padding-left:8px;margin-top:3px}
.conf{font-size:10px;color:var(--gold);margin-left:6px;letter-spacing:1px}
.hist{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border)}
.hist .d{font-size:10.5px;color:var(--sub)}
.note{font-size:11.5px;color:var(--sub)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.head .name{font-size:22px;font-weight:800}
.head .meta{font-size:12px;color:var(--sub)}
.editnote{background:var(--panel);border:1px dashed var(--gold);border-radius:12px;padding:10px 14px;
  font-size:12.5px;color:var(--sub);margin-bottom:12px}
.back{display:none;font-size:13px;color:var(--gold);font-weight:700;margin-bottom:10px;cursor:pointer}
@media(max-width:760px){.back{display:block}}
.empty{color:var(--sub);text-align:center;padding:40px 0}
details{margin-bottom:12px}
details .card{margin-bottom:0}
summary{cursor:pointer;font-size:13px;font-weight:700;padding:6px 2px;color:var(--text)}
.strike{text-decoration:line-through;opacity:.55}
</style>
</head>
<body>
<header><h1>🗂 帳場 — 顧客カード</h1><div class="sub">閲覧ビュー(直すのはLINEの帳場くんから)</div></header>
<main>
  <div class="pane" id="listPane">
    <input class="search" id="q" placeholder="名前・呼び名・会社で検索">
    <div class="kchips" id="kchips"></div>
    <div id="list"><div class="empty">読み込み中…</div></div>
  </div>
  <div class="pane" id="detailPane">
    <div class="back" onclick="showList()">‹ 一覧へ</div>
    <div id="detail"><div class="empty">左の一覧からカードを選んでください</div></div>
  </div>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CONF_DOT = { "高": "●●●", "中": "●●○", "低": "●○○" };
let MODE = "mizu", ALL = [], KIND = "all", CUR = "";
const W = (a, b) => MODE === "general" ? b : a;
async function api(u){ const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }

const KINDS = [["all", "すべて"], ["customer", ""], ["staff", ""], ["peer", ""]];
function kindLab(k, sg){
  return ({ customer: W("💐お客様", "💐仕事の相手"),
    staff: sg === "女" ? W("👯同僚ホステス", "👯同僚") : sg === "男" ? W("🤵黒服さん", "🤵上司・先輩") : W("🏠店内", "🏠社内"),
    peer: W("🏮同業", "🏮社外の仲間") })[k] || k;
}
function drawKinds(){
  $("#kchips").innerHTML = KINDS.map(([k]) =>
    `<span class="kchip ${KIND === k ? "on" : ""}" onclick="setKind('${k}')">${k === "all" ? "すべて" : kindLab(k)}</span>`).join("");
}
window.setKind = k => { KIND = k; drawKinds(); drawList(); };
function drawList(){
  const q = ($("#q").value || "").trim();
  const hits = ALL.filter(c => (KIND === "all" || c.kind === KIND) &&
    (!q || c.code.includes(q) || (c.name || "").includes(q) || (c.yobina || "").includes(q) || (c.company || "").includes(q)));
  $("#list").innerHTML = hits.length ? hits.map(c => `
    <div class="row ${c.code === CUR ? "on" : ""}" onclick="openCard('${encodeURIComponent(c.code)}')">
      <div><div class="nm">${esc(c.name || c.code)}</div>
        <div class="mt">${kindLab(c.kind)}${c.company ? "・" + esc(c.company) : ""}</div></div>
      <span class="rk ${esc(c.rank)}">${esc(c.rank)}</span>
    </div>`).join("") : `<div class="empty">見つかりません</div>`;
}
function showList(){ $("#listPane").classList.remove("hidden"); $("#detailPane").classList.add("hidden"); }
function showDetail(){ if (innerWidth <= 760){ $("#listPane").classList.add("hidden"); $("#detailPane").classList.remove("hidden"); } }

window.openCard = async cq => {
  CUR = decodeURIComponent(cq); drawList(); showDetail();
  $("#detail").innerHTML = `<div class="empty">読み込み中…</div>`;
  let d; try { d = await api("/api/web/contact/" + cq); } catch (e) {
    $("#detail").innerHTML = `<div class="empty">読み込めませんでした</div>`; return; }
  drawDetail(d);
};

function kvRow(k, v){ return v ? `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>` : ""; }
const fmtGap = g => g === 0 ? "今日" : g === 1 ? "昨日" : g + "日前";
const fmtMin = m => m < 60 ? `約${m}分` : m < 1440 ? `約${Math.round(m / 60)}時間` : `約${Math.round(m / 1440)}日`;

function drawDetail(d){
  const attrs = d.attrs || {};
  const sg = attrs["店内区分"] || "";
  const standLab = { up: "目上", even: "対等", down: "目下" }[d.stand] || d.stand || "";
  const now = d.now_keys || {};
  const nowHtml = (now.ongoing ? `<div class="pill green">🟢 ${esc(now.ongoing)}</div>` : "") +
    (now.ng ? `<div class="pill red">🚫 ${esc(now.ng)}</div>` : "") +
    (now.relmemo ? `<div class="pill gold">🤝 ${esc(now.relmemo)}</div>` : "");
  const pf = (d.profile_keys || []).map(k =>
    `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${esc(attrs[k])}</div></div>`).join("");
  let persona = "";
  if (d.persona && d.persona.sections) {
    persona = (d.persona.summary ? `<div style="font-weight:700;font-size:13px;margin-bottom:6px">${esc(d.persona.summary)}</div>` : "")
      + d.persona.sections.map(s =>
        `<div class="kv"><div class="k">${esc(s.k)}<span class="conf">${CONF_DOT[s.conf] || ""}</span></div>
         <div class="v">${esc(s.v)}${s.src ? `<div class="quote">「${esc(s.src)}」</div>` : ""}</div></div>`).join("");
  } else {
    persona = `<div class="note">まだ分析していません。LINEの帳場くんのカードから「▶ ペルソナを分析する」を押すとここにも出ます</div>`;
  }
  const tol = (d.persona && d.persona.tolerance || []).map(t => {
    const dec = t.ok === 1 ? "ok" : (t.ok === 0 ? "ng" : "");
    return `<div class="kv ${dec === "ng" ? "strike" : ""}">
      <div class="k">${esc(t.k)}<span class="conf">${CONF_DOT[t.conf] || ""}</span></div>
      <div class="v">${dec === "ok" ? "✅ " : dec === "" ? "❔ " : ""}${esc(t.v)}
        ${t.src ? `<div class="quote">「${esc(t.src)}」</div>` : ""}</div></div>`; }).join("");
  const arc = d.arc && d.arc.current ? `
    ${kvRow("いまの温度", `${esc(d.arc.current.temp)}・${esc(d.arc.current.trend)}<span class="conf">${CONF_DOT[d.arc.current.conf] || ""}</span>`)}
    ${d.arc.dist_change ? kvRow("距離の変化", `${esc(d.arc.dist_change.from)} → ${esc(d.arc.dist_change.to)}`) : ""}
    ${(d.arc.self_modes || []).length ? kvRow("じぶんの型", esc(d.arc.self_modes.map(x => x.v).join("・"))) : ""}
    ${(d.arc.partner_patterns || []).length ? kvRow("相手の癖", esc(d.arc.partner_patterns.map(x => x.v).join("・"))) : ""}
    ${(d.arc.open_loops || []).length ? kvRow("未回収の話", esc(d.arc.open_loops.map(x => x.v).join(" / "))) : ""}
    <div class="note" style="margin-top:6px">${d.arc.ok === 1 ? "✓ 下書きに反映中" : d.arc.ok === 0 ? "✕ 未使用" : "❔ 未確認(LINEの帳場くんで○✕できます)"}</div>` : "";
  const pstats = d.pstats ? `
    ${kvRow("文の長さ", `平均 約${d.pstats.avg_len}文字`)}
    ${kvRow("絵文字", d.pstats.emoji_per_msg < 0.05 ? "ほぼ使わない" : `1通あたり約${d.pstats.emoji_per_msg}個`)}
    ${d.pstats.reply_median_min != null ? kvRow("返信の速さ", `こちらの送信からだいたい ${fmtMin(d.pstats.reply_median_min)}`) : ""}
    ${d.pstats.top_hours && d.pstats.top_hours.length ? kvRow("よく来る時間", d.pstats.top_hours.map(h => h + "時台").join("・")) : ""}` : "";
  const news = (d.news || []).map(x =>
    `<div class="hist">📰 ${esc(x.title)}${x.opener ? `<div class="quote">→ ${esc(x.opener)}</div>` : ""}</div>`).join("");
  const hist = []
    .concat((d.history.seki || []).map(x => ({ ts: x.ts, t: "🍾 お席(" + esc(x.kind || "来店") + ")" })))
    .concat((d.history.received || []).map(x => ({ ts: x.ts, t: "📩 " + esc((x.text || "").slice(0, 40)) })))
    .concat((d.history.sent || []).map(x => ({ ts: x.ts, t: "📤 " + esc((x.text || "").slice(0, 40)) })))
    .sort((a, b) => b.ts - a.ts).slice(0, 10)
    .map(x => `<div class="hist"><div class="d">${new Date(x.ts * 1000).toLocaleDateString("ja-JP")}</div>${x.t}</div>`).join("");
  $("#detail").innerHTML = `
    <div class="back" onclick="showList()">‹ 一覧へ</div>
    <div class="head"><span class="name">${esc(d.name || d.code)}</span>
      <span class="meta">ランク${esc(d.rank)}・${kindLab(d.kind, sg)}${standLab ? "・" + standLab : ""}
        ${d.gap_days != null ? "・最終接触 " + fmtGap(d.gap_days) : ""}</span></div>
    <div class="editnote">✎ このページは閲覧用です。直すときは <b>LINEの帳場くん</b>(トークのメニュー→🏮ひらく)でこのカードを開いてください</div>
    ${nowHtml ? `<div class="card"><h3>📌 いま効くこと</h3>${nowHtml}</div>` : ""}
    <div class="card"><h3>🤝 関係・接し方</h3>
      ${kvRow("種別・立場", `${kindLab(d.kind, sg)}${standLab ? "・" + standLab : ""}`)}
      ${d.flag_koi ? kvRow("モード", "💘 ガチ恋対応") : ""}
      ${d.flag_ero == 1 ? kvRow("下ネタ", "いなし") : ""}
      ${d.note ? kvRow("メモ", esc(d.note)) : ""}
      ${d.birthday ? kvRow("誕生日", "🎂 " + esc(d.birthday)) : ""}
      ${attrs["担当"] ? kvRow("担当", esc(attrs["担当"])) : ""}
      ${attrs["お気に入りキャスト"] ? kvRow("お気に入り", "💛 " + esc(attrs["お気に入りキャスト"])) : ""}
      ${d.rel ? kvRow("口調", `自分→${esc(d.rel.my_register)} ／ 相手→${esc(d.rel.your_register)}`) : ""}
      ${d.rel && d.rel.initiator ? kvRow("会話の起点", esc(d.rel.initiator)) : ""}
      ${d.rel && d.rel.visits ? kvRow(W("お席の実績", "会った実績"), `🍾 ${d.rel.visits}回${d.rel.dohan ? W("・同伴", "・一次会") + d.rel.dohan : ""}${d.rel.after ? W("・アフター", "・二次会") + d.rel.after : ""}`) : ""}
      ${(d.aliases || []).length ? kvRow("別名(紐づけ)", esc(d.aliases.join("・"))) : ""}
    </div>
    ${arc ? `<details open><summary>🌡 温度メモ（AI分析）</summary><div class="card">${arc}</div></details>` : ""}
    ${pstats ? `<details><summary>📊 相手のクセ（やりとりから）</summary><div class="card">${pstats}
      ${d.pstats.note ? `<div class="note" style="margin-top:6px">${esc(d.pstats.note)}</div>` : ""}</div></details>` : ""}
    <details open><summary>🧠 ペルソナ</summary><div class="card">${persona}</div></details>
    ${tol ? `<details open><summary>🚦 どこまでOKか（○=下書きに反映中）</summary><div class="card">${tol}</div></details>` : ""}
    ${pf ? `<details open><summary>👤 プロフィール</summary><div class="card">${pf}</div></details>` : ""}
    ${news ? `<details open><summary>📰 ネタ</summary><div class="card">${news}</div></details>` : ""}
    ${hist ? `<details><summary>🕘 履歴</summary><div class="card">${hist}</div></details>` : ""}`;
}

async function load(){
  let d;
  try { d = await api("/api/web/contacts"); } catch (e) {
    $("#list").innerHTML = `<div class="empty">読み込めませんでした(ログインし直してみてください)</div>`; return; }
  MODE = d.mode || "mizu"; ALL = d.contacts || [];
  drawKinds(); drawList();
}
$("#q").addEventListener("input", drawList);
load();
</script>
</body>
</html>
