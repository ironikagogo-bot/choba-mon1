<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>帳場くん</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --sub2:#5A5348; --chiptx:#4A443A; --line2:#F0EBDE; --track:#EDE8DB; --head:#1B2A4A;   /* v150: 直書き色の変数化 */
  --navy:#1B2A4A; --gold:#A8842F; --red:#C0402C; --green:#2E7D32;
  --line:#06C755; --cream:#F7F5EF; --border:#E6E1D4; --ink:#2B2823; --sub:#6B6455;
  --panel:#fff; --bubble:#EDF0F7; --bubble-bd:#D4DBEA;
}
/* v123(C): カード折りたたみ */
details.card>summary{font-size:15px;font-weight:700;color:var(--navy);cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--sub);font-size:13px}
details.card:not([open])>summary::after{content:"▸ ひらく";color:var(--gold);font-size:13px}
details.card>summary~*{margin-top:8px}
body.dark details.card>summary{color:var(--ink)}
/* v123: ダークモード(夜の店内・暗い所で眩しくない) */
body.dark{
  --cream:#101319; --panel:#1B2028; --border:#333A46; --ink:#E9E4DA; --sub:#9B948A;
  --bubble:#232B38; --bubble-bd:#333C4E; --gold:#C9A44C;
  /* v150: ダークのコントラスト総修正(夜の店内が主戦場) */
  --sub2:#A8A196; --chiptx:#C8C2B6; --line2:#2A3140; --track:#2A3140; --head:#E9E4DA;
}
body.dark .tile b{color:var(--ink)}
body.dark .btn.ghost{color:var(--ink);border-color:var(--border)}
body.dark .btn.primary{color:#1B2028;font-weight:800}
body.dark .banner[style*="F9ECEA"]{background:#3A2320!important;border-color:#7A4A42!important}
body.dark .kv .k, body.dark .note, body.dark label.f, body.dark .row .meta{color:var(--sub2)}
body.dark .msgcard, body.dark .ibar .who{color:var(--ink)}
body.dark .banner{background:var(--panel)!important;border-color:var(--border)!important}
body.dark .rtag{filter:brightness(.92) saturate(.9)}
body.dark img, body.dark #qrimg{background:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;font-size:16px;line-height:1.6}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#F0ECE2;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header .back{font-size:20px;line-height:1;color:#F0ECE2;background:none;border:none;
  padding:8px 14px 6px;margin:-8px -6px -6px -16px;min-width:44px;min-height:44px;
  visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  /* v150: 当たり判定44px(実測15×30→44×46)。v161: 本人指摘で「常にホームへ戻る」を
     常時ラベル表示にして迷子防止をより明確に(v144のルール自体は不変)。 */
header .back .lbl{font-size:9px;font-weight:700;line-height:1;color:#CBD3E3}
header.has-back .back{visibility:visible}
header h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12.5px;color:#CBD3E3}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center}
.tile b{display:block;font-size:22px;color:var(--navy)}
.tile span{font-size:11px;color:var(--sub)}
/* v183: ネタの金パルス(点滅対象=行事・紙面の当日新着のみ。赤=本流エラー専用のため金) */
.tile-new{animation:netapulse 2.4s ease-in-out infinite}
@keyframes netapulse{0%,100%{box-shadow:0 0 0 0 rgba(201,164,76,0)}
  50%{box-shadow:0 0 0 6px rgba(201,164,76,.25)}}
@media (prefers-reduced-motion: reduce){.tile-new{animation:none;outline:2px solid var(--gold)}}
.banner{background:#FBF6E9;border:1px solid #E8D9AE;border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;margin-bottom:12px}
.banner .txt{flex:1;font-size:13px}
.banner b{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.navcard{background:var(--navy);color:#F0ECE2;border:none;cursor:pointer;width:100%;text-align:left;
  border-radius:14px;padding:15px 16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.navcard b{font-size:15px}
.navcard .desc{font-size:13px;color:#CBD3E3;margin-top:3px}
.navcard .n{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:12px;
  font-weight:700;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.navcard.gold{background:var(--panel);color:var(--ink);border:1px solid var(--border)}
.navcard.gold .desc{color:var(--sub)}
.stat-ok{color:var(--green);font-weight:700}
.stat-ng{color:var(--red);font-weight:700}
.seclabel{font-size:12px;color:var(--sub);font-weight:700;margin:16px 2px 8px}
.row{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;cursor:pointer}
.row .nm{font-weight:700}
.row .meta{font-size:13px;color:var(--sub2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .body{flex:1;min-width:0}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff;flex:none}
.badge.S{background:var(--gold)} .badge.A{background:#8A96B0} .badge.B{background:#C4BDA9}
.chev{color:#C4BDA9;font-size:18px}
.search{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:16px;
  background:var(--panel);margin-bottom:10px}
h3.sec{font-size:14px;margin:0 0 9px;display:flex;align-items:center;gap:6px}
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:15px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--sub2);font-weight:700;flex:none;width:92px;font-size:13px;padding-top:2px}
.kv .v{flex:1;word-break:break-word}
.pill{display:inline-block;border-radius:8px;padding:6px 10px;font-size:13px;margin:0 6px 6px 0}
.pill.green{background:#EAF4EA;color:var(--green);border:1px solid #CBE3CC}
.pill.red{background:#F9ECEA;color:var(--red);border:1px solid #EBCFC9}
.pill.navy{background:#EDF0F7;color:var(--navy);border:1px solid #D4DBEA}
.pill.gold{background:#FBF6E9;color:#7A5F1E;border:1px solid #E8D9AE}
.conf{color:#7A6E48;font-size:12px;margin-left:6px;font-weight:700}
.quote{color:#7A756A;font-size:12px;margin-top:2px}
.hist{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line2)}
.hist:last-child{border-bottom:none}
.hist .d{color:var(--sub);font-size:11px}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;
  cursor:pointer;margin-top:10px;min-height:50px;transition:transform .08s,opacity .08s}
.btn.primary{background:var(--gold);color:#fff}
.btn.ghost{background:var(--panel);color:var(--navy);border:1px solid var(--border)}
.btn.green{background:var(--line);color:#fff}
label.f{display:block;font-size:13px;color:var(--sub2);font-weight:700;margin:15px 2px 6px}
input.f,textarea.f{width:100%;border:1px solid var(--border);border-radius:10px;padding:13px 14px;
  font-size:16px;background:var(--panel);font-family:inherit}
textarea.f{min-height:90px;resize:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:99px;padding:11px 16px;font-size:15px;
  cursor:pointer;color:var(--chiptx);min-height:44px;display:inline-flex;align-items:center;
  transition:transform .08s,opacity .08s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* v162: 本人指摘「タップできない」対策。*{-webkit-tap-highlight-color:transparent}で
   iOS標準のタップ光彩を消しているぶん、押した瞬間の視覚フィードバックが無く「反応してない」と
   誤解されやすかった。押下時にわずかに縮む/薄くなる形で確実に返す(全chip・btn共通)。 */
.chip:active,.btn:active{transform:scale(.96);opacity:.8}
/* v176: 送信ユニット(検索語フィールド+回収レーン)。shareTargetPickerの検索が外れる問題対策。
   合議(4案×3レンズ審査)の結論: 検索欄型フィールドで「貼る物」を絵で伝え、候補は常時可視、
   外れ語は✗で二度踏み防止、学習(確定語)は本人タップ=確定・「戻す」で即取消。 */
.swunit{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-top:12px;background:var(--panel)}
.swpaste{width:100%;background:var(--bubble);border:none;border-bottom:1px solid var(--bubble-bd);
  padding:9px 13px;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;text-align:left;
  min-height:46px;transition:transform .08s,opacity .08s}
.swpaste:active{transform:scale(.97);opacity:.85}
.swpaste .mag{font-size:15px;flex:none;opacity:.85}
.swpaste .w{font-size:17px;font-weight:700;color:var(--ink);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.swpaste .fx{flex:none;background:var(--gold);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}
body.dark .swpaste .fx{color:#1B2028}
.swpaste .ok{flex:none;background:#EAF4EA;color:var(--green);border:1px solid #CBE3CC;font-size:12px;
  font-weight:800;border-radius:8px;padding:3px 9px;white-space:nowrap}
body.dark .swpaste .ok{background:#1E3320;border-color:#3A5C3D;color:#8FCF95}
.swpaste.warn{background:#FBF6E9;border-bottom-color:#E8D9AE}
body.dark .swpaste.warn{background:#332B18;border-bottom-color:#6A5A2E}
.swstep{font-size:12.5px;color:var(--sub2);padding:7px 14px;border-bottom:1px solid var(--line2)}
.swstep b{color:var(--ink)}
.swwline{font-size:12.5px;color:#7A5F1E;background:#FBF6E9;padding:7px 14px;
  border-bottom:1px solid #E8D9AE;font-weight:700}
body.dark .swwline{background:#332B18;border-bottom-color:#6A5A2E;color:#E3C87A}
.swunit .btn.green{margin:0;border-radius:0}
.swalts{padding:12px 14px 13px;border-top:1px dashed var(--border)}
.swaltlab{font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:9px}
.chip.swdim{border-style:dashed;color:var(--sub);font-size:13px}
.chip.swtried{color:var(--sub)}
.chip.swtried .x{color:var(--red);font-weight:800;font-style:normal;margin-right:4px}
.chip.swtried .t{text-decoration:line-through;text-decoration-thickness:1px;opacity:.75}
.swlearn{display:flex;align-items:center;gap:8px;margin-top:10px}
.swlearn .msg{font-size:12.5px;color:var(--green);font-weight:700;flex:1;min-width:0}
.swundo{flex:none;border:1px solid var(--border);background:var(--panel);color:var(--chiptx);border-radius:99px;
  padding:8px 14px;font-size:13px;font-weight:700;min-height:40px;cursor:pointer}
.swexit{font-size:12.5px;color:var(--sub);margin-top:2px}
.swexit b{color:var(--ink);font-weight:700}
/* v181: お礼カードの役割帯(本人要望: 横一直線・半透明・テーマ連動。客=金/ヘルプ=緑/紹介・共有=紺) */
.orole{display:flex;align-items:center;gap:8px;margin:-14px -14px 10px;padding:9px 14px;
  border-radius:14px 14px 0 0;font-size:13.5px;font-weight:700}
.orole .plink{color:inherit}
.orole .rl{margin-left:auto;font-size:12px;font-weight:800;opacity:.85;flex:none}
.orole.gold{background:rgba(168,132,47,.13);color:#7A5F1E;border-bottom:1px solid rgba(168,132,47,.25)}
.orole.green{background:rgba(46,125,50,.11);color:#2E7D32;border-bottom:1px solid rgba(46,125,50,.22)}
.orole.navy{background:rgba(27,42,74,.10);color:#1B2A4A;border-bottom:1px solid rgba(27,42,74,.20)}
body.dark .orole.gold{background:rgba(201,164,76,.16);color:#E3C87A;border-bottom-color:rgba(201,164,76,.30)}
body.dark .orole.green{background:rgba(96,200,120,.13);color:#8FCF95;border-bottom-color:rgba(96,200,120,.26)}
body.dark .orole.navy{background:rgba(120,150,210,.13);color:#AFC3E8;border-bottom-color:rgba(120,150,210,.26)}
.jobrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px;flex-wrap:wrap}
.jobrow:last-child{border-bottom:none}
.jobrow .st{margin-left:auto;font-size:12px;font-weight:700;flex:1 1 auto;min-width:0;text-align:right;white-space:normal;word-break:break-word;max-width:100%}   /* v151: 長文エラーで画面幅が壊れない */
.st.done{color:var(--green)} .st.err{color:var(--red)} .st.run{color:var(--gold)} .st.amb{color:var(--red)}
.note{font-size:12.5px;color:var(--sub2);margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #E8D9AE;border-top-color:var(--gold);
  border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* v162: 呼び名未登録の注意喚起(本人指摘)。カード上部の名前の右に付ける小さな赤バッジ */
.hd-alert{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  vertical-align:2px;margin-left:2px;animation:hdblink 1.3s ease-in-out infinite}
@keyframes hdblink{0%,100%{opacity:1}50%{opacity:.3}}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:26px 0}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;
  border-radius:99px;padding:10px 20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.plink{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
/* v141: カード下部の固定バー(この人の確認が残っている間だけ出す) */
.stickyfix{position:fixed;left:10px;right:10px;bottom:12px;z-index:40;display:flex;align-items:center;gap:8px;
  background:var(--navy);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.prog{height:5px;background:var(--track);border-radius:99px;margin:2px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
/* v120: 返信インフォバー(案A) */
.ibar{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--gold);
  border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ibar.urgent{border-left-color:var(--red)}
.ibar .who{font-size:20px;font-weight:800;color:var(--navy)}
.ibar .when{font-size:13px;color:var(--sub);white-space:nowrap}
.rtag{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:700}
.rt-urgent{background:#FBE9E5;color:var(--red)}
.rt-visit{background:#F5EDDA;color:#7A5F1E}
.rt-chat{background:#EDEDEA;color:#555}
.rt-angry{background:#EFE5F5;color:#6A3B8F}
.rt-money{background:#E3F0E4;color:#2E7D32}
.msgcard{background:var(--bubble);border:1px solid var(--bubble-bd);border-radius:14px 14px 14px 4px;
  padding:12px 14px;font-size:14px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.draft{background:var(--panel);border:2px solid var(--border);border-radius:4px 14px 14px 14px;
  padding:12px 14px;margin-bottom:10px}
.draft.sel{border-color:var(--gold)}
.draft .t{font-size:14px;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.draft textarea{width:100%;border:1px solid var(--gold);border-radius:10px;padding:10px;
  font-size:16px;font-family:inherit;min-height:96px;margin-bottom:8px;overflow:hidden}
.draft .row{display:flex;gap:8px}
.draft .row .btn{margin-top:0;padding:11px;font-size:14px;flex:1}
.actbar{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:1px solid var(--border);
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;z-index:20;
  max-width:560px;margin:0 auto}
/* v191(#23): 「✕ 返さない?」(armed)基準の固定幅=arm時に他ボタンがレイアウトシフトしない */
.actbar .xleft{flex:0 0 auto;min-width:80px;text-align:center;margin-right:8px;color:var(--sub)}
.actbar .xleft.armed{border-color:var(--red);color:var(--red);font-weight:800}
/* v191(#22): 主要アクションのタップ域44px(規約) */
.actbar button{flex:1;border:1px solid var(--border);background:var(--panel);border-radius:10px;
  padding:11px 3px;font-size:12px;color:var(--sub);cursor:pointer;font-weight:700;min-height:44px}
.skel{border-radius:10px;background:linear-gradient(90deg,#EFEAE0 25%,#F7F3E9 50%,#EFEAE0 75%);
  background-size:200% 100%;animation:sk 1.2s infinite;height:72px;margin-bottom:10px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.hasbar{padding-bottom:96px}
/* v175: ホーム整頓(本人指摘)。カードの羅列を用途別の小見出しで区切る */
.hsec{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.06em;margin:16px 4px 6px}
#toast.show{opacity:1}
dialog{border:none;border-radius:16px;padding:20px;max-width:320px;width:88%;}
dialog::backdrop{background:rgba(27,42,74,.45)}
dialog p{margin-bottom:14px;font-size:14px}
dialog .btn{margin-top:8px;padding:12px}

/* ===== v177: デザイン洗練パッチD(B+C合体・Claude Design経由・2026-08-09) ===== */
/* ===== 提案パッチD「B+C合体」(v177候補) =====
   ライト=C(枠線を透明にして二層の極薄影・小見出しに細線)
   ダーク=B(地を一段沈め・内側1pxハイライト・紺グラデ・金の灯り)
   既存クラス名・変数維持。新色は変数追加のみ。 */
/* --- C: ライトの輪郭を影へ --- */
:root{--cream:#F5F2EA;
  --shadow-soft:0 1px 3px rgba(27,42,74,.07),0 1px 2px rgba(27,42,74,.05);
  --panel-hi:rgba(255,255,255,0);--navy-hi:#1E3054;--navy-lo:#16223C}
.card,.row,.tile,.swunit,.navcard.gold{border-color:transparent;box-shadow:var(--shadow-soft)}
.banner{border-color:#EFE3C2;box-shadow:var(--shadow-soft)}
.draft{border-color:#EDE8DC}
.hsec,.seclabel{display:flex;align-items:center;gap:10px}
.hsec::after,.seclabel::after{content:"";flex:1;height:1px;background:var(--line2)}
.prog{background:#EAE4D4}
/* --- B: ダークの艶 --- */
body.dark{
  --cream:#0C0F15;--panel:#171C25;--border:#2B3240;--line2:#242B38;--track:#242B38;
  --bubble:#1F2735;--bubble-bd:#2E3848;--panel-hi:rgba(255,255,255,.05)}
body.dark .card,body.dark .row,body.dark .tile,body.dark .swunit,body.dark .draft{
  border-color:var(--border);
  box-shadow:inset 0 1px 0 var(--panel-hi),0 2px 12px rgba(0,0,0,.30)}
body.dark .navcard{background:linear-gradient(165deg,var(--navy-hi),var(--navy-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
body.dark .navcard.gold{background:var(--panel);
  box-shadow:inset 0 1px 0 var(--panel-hi),0 2px 12px rgba(0,0,0,.30)}
body.dark header{background:linear-gradient(180deg,var(--navy-hi),#1B2A4A)}

<script>
"use strict";
const LIFF_ID = "__LIFF_ID__";
let ID_TOKEN = "", ING = "";
const $ = s => document.querySelector(s);
// v127: JS標準prompt()の廃止(iOSでドメイン名入りシステムダイアログが出て興ざめ+既定値も出ない)
function askEdit(title, value) {

    const d = $("#edlg"); $("#edlgTitle").textContent = title;
    const ta = $("#edlgTa"); ta.value = value || "";
    $("#edlgOk").onclick = () => { d.close(); res((ta.value || "").trim() || null); };
    $("#edlgNo").onclick = () => { d.close(); res(null); };
    d.showModal(); setTimeout(() => { ta.focus(); try { autogrow(ta); } catch (e) {} }, 60);
  });
}
// v156/v157: 表示プロファイル(🏮夜職⇄👔一般)。文言と見た目だけの切替でロジック・データは一切変えない。
// v157: トグルはサーバーが CHOUBA_MODE=general の時(=aki-test)だけ表示。モニターには存在自体見えない
let GENMODE = false, MODESW = false;
try { GENMODE = localStorage.getItem("cb_mode") === "general"; } catch (e) {}
const W = (mizu, gen) => (GENMODE && MODESW) ? gen : mizu;
window.modeToggle = () => {
  GENMODE = !GENMODE;
  try { localStorage.setItem("cb_mode", GENMODE ? "general" : "mizu"); } catch (e) {}
  toast(GENMODE ? "👔 一般モード(見た目だけ)に切替" : "🏮 夜職モードに切替");
  bust("home"); route();
};
// v171: 見出しの表示名モード(全体設定・顧客ごとではない)。code=登録名 / yobina=呼び名 / honmyo=本名。
// 選んだ項目が未登録のカードは登録名に自動フォールバック。メッセージ文面(お礼・返信)は常に呼び名(別概念)。
let NAMEMODE = "code";
try { NAMEMODE = localStorage.getItem("cb_namemode") || "code"; } catch (e) {}
const NAMEMODE_LAB = { code: "登録名", yobina: "呼び名", honmyo: "本名" };
function idxName(code, yobina, honmyo) {
  if (NAMEMODE === "yobina" && (yobina || "").trim()) return yobina;
  if (NAMEMODE === "honmyo" && (honmyo || "").trim()) return honmyo;
  return code;
}
// v174: 本人指摘「循環チップは何が起きるかわかりにくい。ドロップダウンかよりいい方法で」。
// 循環をやめ、⚙で開く専用ピッカーパネル(選択肢が全部見える・現在値が点灯)に変更+並び順を追加
let SORTMODE = "rank";
try { SORTMODE = localStorage.getItem("cb_sortmode") || "rank"; } catch (e) {}
const SORTMODE_LAB = { rank: "ランク順", recent: "やり取りが新しい順", name: "名前順" };
let _dispOpen = false;
window.dispPanel = () => { _dispOpen = !_dispOpen; vList(); };
window.dispSet = (kind, v) => {
  if (kind === "name") { NAMEMODE = v; try { localStorage.setItem("cb_namemode", v); } catch (e) {} }
  else { SORTMODE = v; try { localStorage.setItem("cb_sortmode", v); } catch (e) {} }
  vList();
};

// v151: タイプ「OK」確認の全廃。半角英字入力は合言葉と同じ脱落スキルなので、
// 危険操作の確認は「赤いダイアログでもう1回タップ」に統一(2段階タップ)
function askDanger(title, desc) {
  return new Promise(res => {
    const d = $("#dangerdlg");
    $("#dangerTitle").textContent = title;
    $("#dangerDesc").textContent = desc || "";
    $("#dangerGo").onclick = () => { d.close(); res(true); };
    $("#dangerNo").onclick = () => { d.close(); res(false); };
    d.showModal();
  });
}
const disp = n => { n = String(n || ""); const m = n.match(/^(.+?)\((.+)\)$/);
  if (m) n = m[1];
  return /(さん|様|さま|ちゃん|くん|君|ママ|先生)$/.test(n) ? n : n + "さん"; };
const jarg = v => JSON.stringify(v).replace(/&/g, "\\u0026").replace(/'/g, "\\u0027").replace(/"/g, '&quot;');   // v150: onclick属性用の安全な引数化
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); };
// v141: 名前タップ→顧客カード。data-plink="エンコード済みコード" を付けるだけで有効
document.addEventListener("click", e => {
  const pl = e.target.closest("[data-plink]");
  if (pl && pl.dataset.plink) { e.stopPropagation(); nav("#card/" + pl.dataset.plink); }
});

// ---- 認証つきfetch ----
async function api(path, opt = {}) {
  opt.headers = opt.headers || {};
  if (ID_TOKEN) opt.headers["Authorization"] = "Bearer " + ID_TOKEN;
  if (ING) opt.headers["X-Ingest-Token"] = ING;
  const r = await fetch(path, opt);
  if (r.status === 401) { toast("認証できませんでした"); throw new Error("401"); }
  return r.json();
}

// ---- 起動: LIFF初期化(失敗時は開発用トークン) ----
// v123: ダークモード(既定=端末設定に追従・🌙で手動切替を記憶)
function applyTheme() {
  let saved = null;
  try { saved = localStorage.getItem("cb_theme"); } catch (e) {}
  const dark = saved ? saved === "dark" : (matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.body.classList.toggle("dark", dark);
  const b = $("#themeBtn"); if (b) b.textContent = dark ? "☀️" : "🌙";
}
window.toggleTheme = () => {
  const dark = document.body.classList.contains("dark");
  try { localStorage.setItem("cb_theme", dark ? "light" : "dark"); } catch (e) {}
  applyTheme();
};
async function boot() {
  applyTheme();
  const p = new URLSearchParams(location.search);
  if (p.get("token")) { ING = p.get("token"); sessionStorage.setItem("ing", ING); }
  else if (sessionStorage.getItem("ing")) ING = sessionStorage.getItem("ing");
  route();   // ★キャッシュがあれば認証を待たずに0msで描く
  if (LIFF_ID && LIFF_ID !== "__LIFF" + "_ID__") {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      ID_TOKEN = liff.getIDToken() || "";
    } catch (e) { console.log("liff init fail", e); }
  }
  if (!ID_TOKEN && !ING) {
    // v151: 開発用prompt()の廃止(エンドユーザーに見える穴だった)。
    // 案内カードを出し、開発時はURLに ?token= を付ける運用に一本化
    setHead("🏮 帳場くん", "", false);
    $("#view").innerHTML = `<div class="card" style="text-align:center;padding:26px 16px">
      <div style="font-size:44px">🙇‍♀️</div>
      <h3 class="sec" style="justify-content:center;margin-top:10px">うまくひらけませんでした</h3>
      <p style="font-size:15px;margin:10px 0 2px">帳場くんの<b>LINEトークにあるメニュー</b>から、<br>もう一度ひらいてみてください。</p>
    </div>`;
    return;
  }
  // v151: 合言葉レス・ひも付けリンク(?bind=)。タップだけでひも付け完了
  let bindTok = p.get("bind") || "";
  const lst = p.get("liff.state");
  if (!bindTok && lst) {
    try { bindTok = new URLSearchParams(lst.replace(/^[?#/]+/, "")).get("bind") || ""; } catch (e) {}
  }
  if (bindTok && ID_TOKEN) {
    // v151: 誤タップ乗っ取り対策 — いきなり消化せず、1画面はさんで本人にタップさせる
    setHead("🔑 はじめまして", "", false);
    $("#view").innerHTML = `<div class="card" style="text-align:center;padding:26px 16px">
      <div style="font-size:46px">🏮</div>
      <h3 class="sec" style="justify-content:center;margin-top:10px">この帳場くんを、あなた専用にします</h3>
      <p style="font-size:15px;margin:10px 0 2px">下のボタンを押すだけで準備完了。<br>パスワードや入力はありません。</p>
      <button class="btn primary" style="margin-top:16px" id="bindGo">✓ わたしの帳場くんにする</button>
      <p class="note" style="margin-top:10px">あなた宛てでない場合は、そのまま閉じてください。</p>
    </div>`;
    await new Promise(done => { $("#bindGo").onclick = done; });
    // v160: 通信失敗をcatch{}で無言に握りつぶし、直前に「パスワードや入力はありません」と
    // 見せた直後に矛盾する旧・合言葉案内(showBindGuide)へ落ちる事故を修正。店内の弱い電波で
    // 起きやすい(再現条件: タップ直後にfetchが失敗する)。ここでは必ずbindTok専用の画面で
    // 結果を返し、失敗時はその場で再試行できるようにする(showBindGuideへは絶対に落とさない)。
    try {
      const r = await fetch("/api/liff/bind", { method: "POST",
        headers: { "Authorization": "Bearer " + ID_TOKEN, "Content-Type": "application/json" },
        body: JSON.stringify({ bind: bindTok }) }).then(x => x.json());
      if (r && r.bound) { toast("🔑 ひも付けが完了しました！このままお使いいただけます"); }
      else if (r && r.error) { showBindExpired(); return; }
      else { showBindRetry(); return; }
    } catch (e) { showBindRetry(); return; }
    route();
  }
  // 未ひも付けチェック(リセット後の詰まり対策・v115)
  try {
    const h = await fetch("/api/liff/hello").then(r => r.json());
    MODESW = h.mode === "general";   // v157: aki-testだけ表示トグルを解禁
    if (ID_TOKEN && h.has_liff && !h.bound) { showBindGuide(); return; }
  } catch (e) {}
  route();   // 認証完了後にもう一度描く(キャッシュ表示→実データへ)
  warmBoot();
}
function showBindRetry() {

// ---- サクサク基盤v103: localStorage永続キャッシュ=画面を0msで描いて裏で更新 ----
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("cb_" + k)); } catch (e) { return null; } },
  set(k, d) { try { localStorage.setItem("cb_" + k, JSON.stringify({ t: Date.now(), d })); } catch (e) {} },
  del(k) { try { localStorage.removeItem("cb_" + k); } catch (e) {} },
};
function bust(pref) {
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith("cb_" + pref)) localStorage.removeItem(k);
  }
}
// キャッシュがあれば即describe→裏で取得して差し替え。ビューを離れていたら差し替えない
async function cached(key, path, render, maxAge = 45) {
  const here = location.hash || "#home";
  const hit = store.get(key);
  if (hit) { try { render(hit.d, true); } catch (e) {} }
  if (hit && (Date.now() - hit.t) / 1000 < maxAge) return;
  if (!ID_TOKEN && !ING) return;   // 認証前(初回起動の一瞬)は裏更新だけ諦める
  try {
    const d = await api(path);
    store.set(key, d);
    if ((location.hash || "#home") === here) render(d, false);
  } catch (e) { if (!hit) { try { render(null, false); } catch (_) {} } }
}

// LINEで送る: shareTargetPicker(本人のLINEから送信) → 不可ならコピー
// searchName: picker検索用に相手名をクリップボードへ(1000人問題対策=検索欄に貼るだけ)
// v130: LINE検索でヒットしやすい語に整形(全角スペース・括弧・絵文字で完全一致しない問題)
function lineSearchWord(name) {
  let n = String(name || "");
  const m = n.match(/^(.+?)[(（]/); if (m) n = m[1];          // 括弧以降を捨てる
  n = n.split(/[\s　・]/)[0] || n;                        // 最初の語だけ(部分一致で探す)
  return n.replace(/[\u{1F000}-\u{1FFFF}☀-➿]/gu, "").trim() || String(name || "");
}
// v176: 検索語の候補分解。LINE表示名(検索名)を語片に割り、識別力の高い順に並べる。
// 背景: LINE検索名の全文コピー(v150〜)は「Yo Kimura _ 木村 曜」のような混在文字列で
// picker検索にヒットしない実運用報告(2026-08-09キムさん事故)。ホステス流の登録名
// 「大山さん🌵AMANE芳美（誕生日）」にも対応: 客名が先頭・店/担当は後ろの構造を利用。
// 並び: 漢字→英字(3字以上)→かな。担当名・複数カード共通語(店名の印)・2文字以下英字は
// 末尾に降格(消さない: 別の語で当たる実例に備え全部見せる裁定)。数字は捨てる。
function swRawTokens(s) {   // v206: 区切り・括弧・敬称処理済みのトークン(混在字種のまま)
  s = String(s || "").replace(/[(（][^)）]*[)）]/g, " ");   // 括弧内(誕生日等のメモ)は捨てる
  return s.split(/[\s　_・、,./|~〜\-]+|[\u{1F000}-\u{1FAFF}☀-➿⬀-⯿️‍]+/u).filter(Boolean)

async function sendViaLine(text, searchName, sname, word) {
  try {
    if (window.liff && liff.isApiAvailable && liff.isApiAvailable("shareTargetPicker")) {
      const w2 = (word || "").trim() || swBest(sname, searchName, "");
      if (w2) { try { await navigator.clipboard.writeText(w2); } catch (e) {} }
      const res = await liff.shareTargetPicker([{ type: "text", text }]);
      return res ? "sent" : "cancel";   // resなし=ユーザーが閉じた
    }
  } catch (e) { console.log("share fail", e); }
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("コピーしました。LINEのトークに貼り付けて送信");
  return "copied";
}

const FAILQ = [];
function _failbar() {
  if (!FAILQ.length) { $("#errbar").style.display = "none"; return; }
  $("#errmsg").textContent = `⚠️ ${FAILQ.length}件の操作が保存できていません(通信)`;
  $("#errbar").style.display = "block";
}
window.dismissErrbar = () => { $("#errbar").style.display = "none"; };
window.retryFails = async () => {
  const q = FAILQ.splice(0); let ok = 0;
  for (const f of q) {
    try {
      const r = await api(f.path, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(f.body) });
      if (r && r.error) FAILQ.push(f); else ok++;
    } catch (e) { FAILQ.push(f); }
  }
  _failbar();
  if (ok) toast(`✓ ${ok}件 保存し直しました`);
}
// v204: 軽量イベント計測(コピー送信など)。失敗しても静かに諦める(FAILQに積まない)
function trackEv(ev) {

    .catch(() => { FAILQ.push({ path, body }); _failbar(); return null; });
  PENDING_FIRES.push(p);
  return p;

// ============ 🧭 じぶんの方針(v167) ============
// 5問×3択。タップ=保存を待ってから点灯(楽観更新禁止の規約)。未選択=おまかせ=従来挙動。
// 画面名は意図的に無色(「bot」「再現」等の語を出さない=覗き見られても代筆の証拠にならない)
const POLICY_QS = () => [
  ["first_dist", "新しい相手への最初の距離感",
    [["keigo", "きっちり敬語"], ["soft", "丁寧だけど柔らかく"], ["casual", "早めにくだける"]]],
  ["invite", "日付を決めない誘い(「今度ごはんでも」)",
    [["ride", "乗って具体を聞く"], ["vague", "ふんわりかわす"], ["store", W("お店に誘導する", "保留して様子見")]]],
  ["push", W("お店へのお誘い(営業)", "会う誘いを自分から"),
    [["active", "自分から積極的に"], ["watch", "相手の温度を見て"], ["rare", "ほぼしない"]]],
  ["length", "文の長さ",
    [["short", "短くテンポよく"], ["match", "相手に合わせる"], ["rich", "しっかりめ"]]],
  ["koi", W("色恋っぽさ", "親密トーン"),
    [["ng", "使わない"], ["some", "相手によって少し"], ["auto", "実例におまかせ"]]],
];
let _policy = null;
async function vPolicy() {
  setHead("🧭 じぶんの方針", "5タップで登録 — 新しい相手への下書きに効く", true);
  $("#view").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try { _policy = (await api("/api/liff/selfpolicy")).policy || {}; }
  catch (e) { $("#view").innerHTML = `<div class="empty">読み込めませんでした</div>`; return; }
  drawPolicy();
}
function drawPolicy() {
  $("#view").innerHTML = `
  <div class="note" style="margin-bottom:10px">まだ実例(あなたの過去の返し)が無い<b>新しい相手</b>への下書きは、ここで選んだ方針で書かれます。実例がある相手はいつも通り実例が優先。未選択は「おまかせ」(今まで通り)です。</div>
  <div class="card">${POLICY_QS().map(([k, lab, opts]) => `
    <label class="f">${lab}</label>
    <div class="chips">${opts.map(([v, ol]) =>
      `<button type="button" class="chip ${_policy[k] === v ? "on" : ""}"
        onclick="policyTap('${k}','${v}')">${ol}</button>`).join("")}</div>`).join("")}
  </div>
  <div class="note" style="margin-top:10px">タップした瞬間に保存されます。もう一度タップで解除。いつでも変えられます。</div>`;
}
window.policyTap = async (k, v) => {
  const next = Object.assign({}, _policy);
  if (next[k] === v) delete next[k]; else next[k] = v;   // 同じ選択肢の再タップ=解除(おまかせに戻す)
  try {
    const r = await api("/api/liff/selfpolicy", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ policy: next }) });
    if (!r.ok) throw new Error();
    _policy = r.policy || next;
    drawPolicy();
  } catch (e) { toast("保存できませんでした。電波の良い所でもう一度押してください"); }
};

// ============ 顧客一覧 ============
let _contacts = null;

      <label class="f" style="margin-top:0">名前の表示</label>

        `<button class="chip ${NAMEMODE === v ? "on" : ""}" onclick="dispSet('name','${v}')">${NAMEMODE_LAB[v]}</button>`).join("")}</div>
      <div class="note" style="margin:4px 0 8px">呼び名・本名が未登録の人は登録名で出ます</div>
      <label class="f">並び順</label>
      <div class="chips">${["rank", "recent", "name"].map(v =>
        `<button class="chip ${SORTMODE === v ? "on" : ""}" onclick="dispSet('sort','${v}')">${SORTMODE_LAB[v]}</button>`).join("")}</div>
    </div>` : ""}
    <input class="search" id="q" placeholder="名前・会社で検索" autocomplete="off">
    <div id="rows">${store.get("contacts" + _listKind) ? "" : `<div class="empty"><span class="spin"></span></div>`}</div>`;
  const _kindAt = _listKind;   // v150: タブ切替レース対策(遅れて来た別タブの結果を描かない)
  cached("contacts" + _listKind, "/api/liff/contacts" + (_listKind ? "?kind=" + _listKind : ""), (d) => {
    if (_listKind !== _kindAt) return;
    if (!d) { $("#rows").innerHTML = `<div class="empty">読み込めませんでした</div>`; return; }
    if (!_listKind) _contacts = d.contacts;   // 既存機能(お礼・取り込み等)は顧客リストを使う
    _listRows = d.contacts; drawList($("#q") ? $("#q").value.trim() : "");
  }, 45);
  const KMARK = { staff: "🏠", peer: "🏮", private: "🔒" };
  const draw = q => {
    let src = _listRows || _contacts || [];
    if (SORTMODE === "recent") src = [...src].sort((a, b) => (b.last_ts || 0) - (a.last_ts || 0));
    else if (SORTMODE === "name") src = [...src].sort((a, b) =>
      String(a.iname || a.name).localeCompare(String(b.iname || b.name), "ja"));
    const rows = src.filter(c => !q || c.name.includes(q) || c.code.includes(q) ||
      (c.company || "").includes(q));
    const note = _listKind === "private"
      ? `<div class="note" style="margin-bottom:8px">🔒 私用=受信を取り込まない相手。「↩ 戻す」で次の受信から通常どおり届きます</div>` : "";
    $("#rows").innerHTML = note + (rows.length ? rows.map(c => c.kind === "muted" ? `
      <div class="row" style="opacity:.75">
        <span class="badge" style="background:var(--line);color:var(--sub)">🔕</span>
        <div class="body"><div class="nm">${esc(disp(c.name))}</div>
        <div class="meta">受信ごと削除中(カードなし)</div></div>
        <button class="chip unmutebtn" data-unmute="${encodeURIComponent(c.code)}">↩ 戻す</button></div>` : `
      <div class="row" data-card="${encodeURIComponent(c.code)}">
        <span class="badge ${c.rank}">${c.rank}</span>
        <div class="body"><div class="nm">${(c.kind && c.kind !== "customer") ? (KMARK[c.kind] || "") + (c.kind === "staff" ? (c.sg === "男" ? "🤵" : "👯") : "") + " " : ""}${esc(c.iname ? idxName(c.iname, c.yobina, c.honmyo) : disp(c.name))}</div>
        <div class="meta">${c.gname ? "👥グループ「" + esc(c.gname) + "」 " : ""}${esc(c.company || "")}${c.ongoing ? " ・📌" + esc(c.ongoing).slice(0, 20) : ""}</div></div>
        <button class="chip editbtn" data-edit="${encodeURIComponent(c.code)}">✎</button>
        <span class="chev">›</span></div>`).join("")
      : `<div class="empty">${_listKind === "private" ? "私用にした相手はいません" : "見つかりませんでした"}</div>`);
  };
  window.drawList = draw;
  window.listKind = k => { _listKind = k; _listRows = null; vList(); };
  if (_listRows || _contacts) draw("");
  $("#q").addEventListener("input", e => draw(e.target.value.trim()));
  // イベント委譲: ✎は編集・それ以外の行タップはカード(window.event非依存=iOS安全)
  $("#rows").addEventListener("click", async e => {
    const ub = e.target.closest(".unmutebtn");
    if (ub) {
      e.stopPropagation();
      const nm = decodeURIComponent(ub.dataset.unmute);
      ub.disabled = true;
      try {
        await api("/api/liff/unmute", { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: nm }) });
        toast(`✓ ${disp(nm)}を戻しました。次の受信から届きます`);
        bust("contactsprivate"); vList();
      } catch (err) { ub.disabled = false; toast("戻せませんでした"); }
      return;
    }
    const eb = e.target.closest(".editbtn");
    if (eb) { e.stopPropagation(); nav("#edit/" + eb.dataset.edit); return; }
    const row = e.target.closest(".row[data-card]");
    if (row) nav("#card/" + row.dataset.card);
  });
}

  const standLab = { up: "目上", even: "対等", down: "目下" }[d.stand] || d.stand || "";

window.cardPrint = async (cq, mode) => {
  const code = decodeURIComponent(cq);
  try {
    const r = await api("/api/liff/print/prep", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, mode }) });
    if (r.error) return toast(r.error);
    if (!r.url) return toast("印刷リンクを作れませんでした(サーバーが古い可能性)");
    // v126: /print が開けない環境向けにAPI名前空間の別口を使う + リンク表示フォールバック
    const url = location.origin + "/api/liff/printview/" + r.url.split("/").pop();
    let opened = false;
    try {
      if (window.liff && liff.openWindow) { liff.openWindow({ url, external: true }); opened = true; }
      else if (window.open(url, "_blank")) opened = true;
    } catch (e) {}
    // 開けたかどうかに関わらず、リンクも画面に出す(長押し→Safariで開く の保険)
    const v = $("#view");
    if (v && !$("#prtlink")) v.insertAdjacentHTML("afterbegin",
      `<div id="prtlink" class="card" style="border-color:var(--gold)">
        📄 印刷ページ${opened ? "を別ブラウザで開きました。開かない場合は" : ":"}
        <a href="${url}" target="_blank" style="color:#3866b0;word-break:break-all">こちらを長押し→「Safariで開く」</a>
        <div class="note" style="margin-top:4px">開いたら 共有→プリント→ピンチアウト→共有→PDF保存(10分有効)</div>
        <button class="chip" style="margin-top:6px;padding:5px 10px;min-height:0;font-size:12px"
          onclick="document.getElementById('prtlink').remove()">閉じる</button></div>`);
  } catch (e) { toast("印刷ビューを開けませんでした(通信)"); }
};

let _dups = [];
function dupSide(s, hot) {
  const kindLab = ({ customer: "💐", staff: "🏠", peer: "🏮" })[s.kind] || "💐";
  const last = s.last_ts ? Math.floor((Date.now() / 1000 - s.last_ts) / 86400) : null;
  return `<div style="flex:1;border:1px solid ${hot ? "var(--gold)" : "var(--border)"};border-radius:10px;padding:8px">
    <div style="font-weight:700">${esc(disp(s.name || s.code))}</div>
    <div style="font-size:11px;color:var(--sub);margin-top:2px">${kindLab} ランク${esc(s.rank)}
      ${s.yobina ? "・呼び名 " + esc(s.yobina) : ""}${s.company ? "・" + esc(s.company) : ""}</div>
    <div style="font-size:11px;color:var(--sub)">受信${s.msgs ?? 0}件${last != null ? "・最終 " + (last === 0 ? "今日" : last + "日前") : "・受信なし"}</div>
  </div>`;
}
function dupRow(p, i) {
  return `<div class="card" id="dp${i}">
    <div style="font-size:11px;color:var(--gold);font-weight:700">🔀 ${esc(p.reason)}</div>
    <div style="display:flex;gap:8px;align-items:stretch;margin:8px 0 4px">
      ${dupSide(p.a)}<div style="align-self:center;color:var(--sub);font-size:11px">vs</div>${dupSide(p.b)}</div>
    <div class="note" style="margin:4px 0 8px">残す方を選ぶと、<b>もう片方のカードは消えて</b>会話・履歴・情報が全部移ります。取り消せません</div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" style="margin:0;flex:1;padding:11px" onclick="dupKeep(${i},'a')">◀ 「${esc(disp(p.a.name || p.a.code))}」を残す</button>
      <button class="btn ghost" style="margin:0;flex:1;padding:11px" onclick="dupKeep(${i},'b')">「${esc(disp(p.b.name || p.b.code))}」を残す ▶</button></div>
    <div style="margin-top:8px;text-align:center">
      <button class="chip" onclick="dupNotSame(${i})">👥 別人です（今後表示しない）</button></div>
  </div>`;
}
async function vDups(code) {
  setHead("🔀 重複カードの統合", "同じ人が2枚になっていたら1枚に", true);
  $("#view").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  let d; try { d = await api("/api/liff/dups"); } catch (e) {
    $("#view").innerHTML = `<div class="empty">読み込めませんでした</div>`; return; }
  _dups = d.items || [];
  // カード画面から来た時はその人のペアを先頭に
  if (code) _dups.sort((p, q) => ((q.a.code === code || q.b.code === code) ? 1 : 0) - ((p.a.code === code || p.b.code === code) ? 1 : 0));
  let html = _dups.length ? _dups.map((p, i) => dupRow(p, i)).join("")
    : `<div class="empty">重複の疑いは見つかりませんでした</div>`;
  html += `<details class="card" ${code && !_dups.some(p => p.a.code === code || p.b.code === code) ? "open" : ""}>
    <summary>🔍 自分で選んで統合する</summary>
    <div class="note" style="margin:6px 0">検出に出てこない2枚を統合する時に。まず1枚目、次に2枚目を選びます。</div>
    <div class="chips" id="dupPickBox"><button class="chip" onclick="dupPick('${encodeURIComponent(code || "")}')">カードを選ぶ</button></div>
    <div id="dupManual"></div>
  </details>`;
  $("#view").innerHTML = html;
}
window.dupKeep = async (i, side) => {
  const p = _dups[i]; if (!p) return;
  const keep = side === "a" ? p.a.code : p.b.code;
  const absorb = side === "a" ? p.b.code : p.a.code;
  const ok = await askDanger(`「${disp(absorb)}」→「${disp(keep)}」に統合`,
    `「${disp(absorb)}」のカードが消えて、会話・履歴・情報が全部「${disp(keep)}」へ移ります。`);
  if (!ok) return toast("やめました");
  try {
    const r = await api("/api/liff/merge", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ keep, absorb }) });
    if (r.error) return toast(r.error);
    store.del("card_" + keep); store.del("card_" + absorb); bust("contacts"); bust("home");
    const el = $("#dp" + i); if (el) el.remove();
    toast(`✓ 「${disp(keep)}」に統合しました`);
  } catch (e) { toast("統合に失敗しました(通信)"); }
};

};

          <button class="chip on" onclick="assignJobTo(${j.id}, ${JSON.stringify(j.contact).replace(/"/g, '&quot;')})">✓ ${esc(disp(nm))}として取り込む</button>
          <button class="chip" style="border-style:dashed" onclick="jobSearch(${j.id})">🔍 違う人を選ぶ</button></span></div>`;
      }
      if (j.status === "ambiguous") {
        const cands = (j.detail && j.detail.cands) || [];
        const guess = (j.detail && (j.detail.name || j.detail.extracted)) || "";
        return `<div class="jobrow" style="flex-wrap:wrap">📄 ${esc(j.fname)}
          <span class="st amb">誰のトーク？</span>
          <span style="flex-basis:100%;margin-top:6px" class="chips" id="jc${j.id}">
          ${cands.slice(0, 4).map(c => `<button class="chip on" onclick="assignJobTo(${j.id}, ${JSON.stringify(c).replace(/"/g, '&quot;')})">${esc(c)}</button>`).join("")}
          ${guess && !cands.includes(guess) ? `<button class="chip" onclick="assignJobTo(${j.id}, ${JSON.stringify(guess).replace(/"/g, '&quot;')})">🆕 「${esc(guess)}」で新規</button>` : ""}
          <button class="chip" style="border-style:dashed" onclick="jobSearch(${j.id})">🔍 他から選ぶ</button></span></div>`;
      }
      // v146: 作成中の行に仕分けチップを出さない(アップ中にタブが並ぶと混乱する・本人指摘)。
      // 種別・立場は完了後の✅確認フローが聞くので、ここで並行入力させる必要はない
      return `<div class="jobrow"><span class="spin"></span> <b>${esc(nm)}</b>
        <span class="st run">作成中…${mark}</span></div>`;
    }).join("") + `</div>`
      : "";
    if (jobs.some(j => j.status === "queued" || j.status === "running"))
      _pollT = setTimeout(poll, 3000);
  }
  // (v146: 旧impRank/impInd/impPrivは clsChips 廃止に伴い削除)
  // v151: エラー行の再実行・掃除
  window.jobRetry = async id => {
    try {
      const r = await api("/api/liff/import/retry", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
      toast(r.ok ? "🔁 もう一度やっています…" : (r.msg || "やり直せませんでした"));
    } catch (e) { toast("やり直せませんでした(通信)"); }
    poll();
  };
  window.jobDismiss = async id => {
    try { await api("/api/liff/import/dismiss", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) }); } catch (e) {}
    poll();
  };
  window.assignJobTo = async (id, v) => {
    if (!v) return;
    try {
      const r = await api("/api/liff/import/assign", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, contact: v }) });
      if (r.error) return toast(r.error);
      toast(`✓ 「${v}」として取り込み開始`); poll();
    } catch (e) { toast("失敗しました"); }
  };
  window.jobSearch = id => {
    const box = $("#jc" + id); if (!box) return;
    const draw = q => {
      const hits = (_contacts || []).filter(c => !q || c.code.includes(q) || (c.name || "").includes(q)).slice(0, 8);
      box.innerHTML = `<input class="f" id="jq${id}" placeholder="名前で絞り込み" value="${esc(q || "")}"
          style="flex-basis:100%;font-size:15px;padding:9px 10px;margin-bottom:6px">`
        + hits.map(c => `<button class="chip" onclick="assignJobTo(${id}, ${JSON.stringify(c.code).replace(/"/g, '&quot;')})">${esc(disp(c.name))}</button>`).join("")
        + (q ? `<button class="chip on" onclick="assignJobTo(${id}, ${JSON.stringify(q).replace(/"/g, '&quot;')})">🆕 「${esc(q)}」で新規</button>` : "");
      const inp = $("#jq" + id);
      inp.addEventListener("input", e => { const val = e.target.value.trim(); draw(val);
        const ni = $("#jq" + id); ni.focus(); ni.setSelectionRange(val.length, val.length); });
      if (q) { inp.focus(); }
    };
    if (!_contacts) api("/api/liff/contacts").then(r => { _contacts = r.contacts; draw(""); });
    else draw("");
  };
}

// ============ 📨 返信(配達ループ・プリフェッチで待ちゼロ) ============
// v190: トリアージ最終仕様P0 — あとで区画/カーソル同夜化/350msロック/アンドゥ3層/完走画面
// ============ v192: トリアージ一覧(順送り機械を廃止して「一覧が主役」に) ============
// 本人裁定(2026-08-11): 案A採用。選別マシン=「🔥いま返す」は 用件(urgent)/ランクS/📌ピン留め。
// 儀式ゼロ: 中段トースト・完走画面・✕2段・カーソル復帰を全廃。タップ最少がLIFFの基本哲学。
// 取り消しは下の黒帯(6秒)と各区画の「↩︎戻す」に一本化(acted_log/undoのサーバ基盤はv190のまま)。
const rep = { items: null, recent: [], acted_n: 0, i: -1, koi_patterns: [] };
let _repLock = 0;
const repLocked = () => Date.now() < _repLock;
const repLock = () => { _repLock = Date.now() + 350; };
// 区画判定: あとで行き=全通↷のみ(open+deferred混在=↷済み相手からの新着は本流に残す。v191#1と同義)
const repIsLater = x => !!x.deferred && (x.count || 1) <= x.deferred;
const repIsHot = x => !!x.urgent || (x.rank === "S" && !x.unlinked) || !!x.pin;

async function vInbox(pri) {
  setHead("📨 受信", "", true);
  $("#view").classList.remove("hasbar");
  $("#view").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  let d; try { d = await api("/api/liff/inbox"); } catch (e) {
    $("#view").innerHTML = `<div class="empty">読み込めませんでした</div>`; return; }
  try { localStorage.removeItem("cb_rep_cursor"); } catch (e) {}   // v192: カーソル廃止の掃除
  rep.items = d.items || [];
  rep.recent = d.recent_acted || [];
  rep.acted_n = d.acted_n || 0;
  rep.koi_patterns = d.koi_patterns || [];
  rep.i = -1;
  if (pri) {   // 🔥通知の「この人の返信をひらく」: その行を開いて位置まで送る
    const k = rep.items.findIndex(x => x.contact === pri);
    if (k >= 0) rep.i = k; else toast(`${disp(pri)}は対応済みです`);
  }
  // 先読み: 🔥区画の先頭2人だけ(展開した瞬間に下書きが出るように)
  rep.items.filter(x => !x.unlinked && !repIsLater(x) && repIsHot(x)).slice(0, 2)
    .forEach(x => prefetchReply(x.mid));
  drawRep();
  if (rep.i >= 0) setTimeout(() => {
    document.getElementById("lr" + rep.i)?.scrollIntoView({ block: "center" }); }, 60);
}

// --- 黒帯スナックバー(唯一のアンドゥ導線。6秒・画面を塞がない) ---
let _sT = null, _sShown = 0, _sActP = null;
function snack(text, actPromise) {
  let el = document.getElementById("snack");
  if (!el) {
    el = document.createElement("div"); el.id = "snack";
    el.addEventListener("click", e => {
      if (!e.target || e.target.tagName !== "U") return;
      if (Date.now() - _sShown < 350) return;   // 二度押しの2打目を吸わない
      el.style.display = "none"; clearTimeout(_sT);
      if (_sActP) undoNow(_sActP);
      _sActP = null;
    });
    document.body.appendChild(el);
  }
  el.innerHTML = `<span>${text}</span>` + (actPromise ? `<u>↩︎ 戻す</u>` : "");
  el.style.display = "flex"; _sShown = Date.now(); _sActP = actPromise || null;
  clearTimeout(_sT);
  _sT = setTimeout(() => { el.style.display = "none"; _sActP = null; }, 4000);   // v192その5: 6秒→4秒(本人裁定)
}
function snackHide() { const el = document.getElementById("snack");
  if (el) el.style.display = "none"; clearTimeout(_sT); _sActP = null; }
async function undoNow(actP) {
  let actId = null;
  try { const r = await actP; actId = r && r.act_id; } catch (e) {}
  if (!actId) { toast("戻せませんでした(通信)"); return false; }
  try {
    const r2 = await api("/api/liff/reply/undo", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ act_id: actId }) });
    if (r2.error) { toast(r2.error); return false; }
  } catch (e) { return toast("戻せませんでした(通信)"), false; }
  bust("home"); toast("↩︎ 戻しました"); vInbox();
  return true;
}
window.repHistUndo = async actId => {   // 区画行の「↩︎戻す」(サーバ確定済みの裁定の取り消し)
  try {
    const r = await api("/api/liff/reply/undo", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ act_id: actId }) });
    if (r.error) return toast(r.error);
  } catch (e) { return toast("戻せませんでした(通信)"); }
  bust("home"); toast("↩︎ 戻しました"); vInbox();
};

// --- 行の1タップ裁定(↷/✕/✓)。楽観移動+黒帯アンドゥ。サーバはv190のact/undoそのまま ---
function _listAct(k, action, label) {
  const it = rep.items[k];
  if (!it || it._done) return;
  repLock();
  const p = fire("/api/liff/reply/act", { mid: it.mid, action, text: "", mids: it.mids });
  p.then(r => { if (r && r.act_id) it._act_id = r.act_id; }).catch(() => {});
  if (action === "deferred") it.deferred = it.count || 1;   // 楽観: 🌙あとで区画へ
  else it._done = action;                                    // skipped/done: 畳んで区画へ
  delete draftCache["m" + it.mid];
  if (rep.i === k) rep.i = -1;
  bust("home");
  drawRep();
  // v201(本人裁定「もっと簡略に」): 黒帯は「記号+名前+2〜4字」の1行に統一
  snack(label || `${{ deferred: "↷", skipped: "✕", done: "✓" }[action] || "✓"} ${esc(disp(it.name))} ${
    { deferred: "あとで", skipped: "返さない", done: "対応済み" }[action] || "記録"}`, p);
}
window.listAct = (k, action) => { if (repLocked()) return; _listAct(k, action); };
window.listUndoLocal = k => {   // 楽観行の取り消し(act往復前でもpromise経由で戻せる)
  const it = rep.items[k];
  if (!it) return;
  if (it._act_id) undoNow(Promise.resolve({ act_id: it._act_id }));
  else toast("処理中です。1秒おいてもう一度押してください");
};

// --- 📌ピン留め(いつも「いま返す」に出す相手。選別マシンの本人調整ダイヤル) ---
window.pinToggle = async k => {
  const it = rep.items[k];

// --- 既存ヘルパ互換(repSend/repCls系がこの2つを呼ぶ): rep.i=展開中の行 ---
function repAdvance(stampText) {
  const it = rep.items[rep.i];
  if (it) { it._done = it._done || "done"; delete draftCache["m" + it.mid]; }
  rep.i = -1; repLock(); bust("home");

window.repAct = action => {   // 展開中カードの下ボタン(✓対応した等)
  if (repLocked() || rep.i < 0) return;
  const k = rep.i, it = rep.items[k];
  if (!it) return;

  const hasDraft = action === "done" && !!document.querySelector("#drafts .draft");
  _listAct(k, action, hasDraft
    ? `✓ ${esc(disp(it.name))} 対応済み・下書き未送信` : null);
};

// --- 行・区画の描画 ---
function _exStrip(s) { return String(s || "").replace(/〔[^〕]*〕/g, " ").replace(/\s+/g, " ").trim(); }
function lrowHtml(p, k) {
  const open = rep.i === k;
  const tm = p.ts ? new Date(p.ts * 1000) : null, now = new Date();
  const tmS = tm ? ((tm.toDateString() === now.toDateString() ? "" :
    (new Date(now - 86400000).toDateString() === tm.toDateString() ? "きのう " :
      `${tm.getMonth() + 1}/${tm.getDate()} `)) +
    `${tm.getHours()}:${String(tm.getMinutes()).padStart(2, "0")}`) : "";
  const why = p.urgent ? `<span class="why">🔥 ${esc(repReason(p.reason || "") || "急ぎ")}</span>`
    : p.pin ? `<span class="why b">📌</span>`
    : p.unlinked ? `<span class="why b">🆕 はじめて</span>`
    : (p.rank === "S" || p.rank === "A") ? `<span class="why b">💎${esc(p.rank)}</span>`
    : p.kind === "staff" ? `<span class="why b">${W("🏠 店内", "🏠 社内")}</span>`
    : p.kind === "peer" ? `<span class="why b">${W("🏮 同業", "🤝 仲間")}</span>` : "";
  const later = repIsLater(p);
  return `<div class="lrow${p.urgent && !later ? " urg" : p.pin && !later ? " pinb" : ""}" id="lr${k}">
    <div class="ltop">
      <span class="lmain" onclick="listOpen(${k})">
        <span class="l1"><span class="nm">${esc(disp(p.name))}</span>
          ${p.unlinked ? "" : `<span class="rk">${esc(p.rank)}</span>`}
          ${p.grp ? `<span class="rk" style="background:var(--cream);color:var(--sub)">👥グループ</span>` : ""}
          ${(p.count || 1) > 1 ? `<span class="rk" style="background:var(--cream);color:var(--sub)">📬${p.count}</span>` : ""}
          <span class="tm">${esc(tmS)}</span></span>

      </span>
      <span class="lbtns">

        <span class="lab" onclick="listAct(${k},'skipped')"><button tabindex="-1">✕</button><small>返さない</small></span>
      </span>
    </div>${open ? lbodyHtml(p, k) : ""}</div>`;
}
function lbodyHtml(p, k) {
  let whenFull = "";
  if (p.ts) {
    const d0 = new Date(p.ts * 1000), now = new Date();
    const sameDay = d0.toDateString() === now.toDateString();
    const yest = new Date(now - 86400000).toDateString() === d0.toDateString();
    const day = sameDay ? "きょう" : yest ? "きのう" : `${d0.getMonth() + 1}/${d0.getDate()}`;
    const mins = Math.floor((now / 1000 - p.ts) / 60);
    const rel = mins < 60 ? `${mins}分前` : mins < 1440 ? `${Math.floor(mins / 60)}時間前` : "";
    whenFull = `${day} ${d0.getHours()}:${String(d0.getMinutes()).padStart(2, "0")}${rel ? `（${rel}）` : ""}`;
  }
  const head = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px">
    <span style="font-size:12px;color:var(--sub)">${whenFull ? esc(whenFull) + "・" : ""}${p.unlinked
      ? "🆕 未登録" : `${W("ランク", "つながり")}${esc(p.rank)}`}</span>
    ${p.unlinked ? "" : `<a href="#" style="font-size:12.5px;display:inline-block;padding:10px 4px;margin:-10px 0"
        onclick="nav('#card/${encodeURIComponent(p.contact)}');return false">▸カード</a>`}
    ${p.unlinked ? "" : `<button class="chip" style="margin-left:auto;padding:4px 10px;min-height:0;font-size:12px${
        p.pin ? ";border-color:var(--gold);font-weight:800" : ""}"
        onclick="pinToggle(${k})">📌 ${p.pin ? "いつも上◎" : "いつも上に"}</button>`}</div>`;
  const msg = `<div class="msgcard">「${esc(p.text)}${p.truncated ? "…" : ""}」
    ${p.truncated ? `<div><a href="#" style="font-size:12px" onclick="repFull(${p.mid});return false">📄 全文を見る</a></div>` : ""}
    ${p.reason ? `<div style="font-size:11px;color:var(--sub);margin-top:6px">💡 ${esc(repReason(p.reason || ""))}</div>` : ""}
    ${p.grp_total ? `<div style="font-size:11px;color:var(--gold);margin-top:4px">👥 グループ ${p.grp_total}通のうち、あなた宛て${p.count || 1}通だけ表示しています</div>`
      : p.grp ? `<div style="font-size:11px;color:var(--gold);margin-top:4px">👥 グループの発言 — すべてがあなた宛てとは限りません(下書きはあなた宛てのぶんにだけ応えます)</div>` : ""}</div>`;
  if (p.unlinked) {

        <div class="chips">${p.cands.map(c2 =>
          `<button class="chip on" onclick="repLink(${JSON.stringify(c2.code).replace(/"/g, '&quot;')})">🔗 ${esc(disp(c2.name))}と同一人物</button>
           <span style="font-size:11px;color:var(--sub);align-self:center">${esc(c2.why)}</span>`).join("")}</div>
        <div style="height:1px;background:var(--border);margin:12px 0"></div>` : "";
    return `<div class="lbody"><div class="card" style="border:none;padding:0;margin:0">
      ${head}${msg}
      <h3 class="sec">🆕 はじめての相手です</h3>
      ${candHtml}
      <div class="note" style="margin:4px 0 8px">💐 ${W("お客様なら、ランクを押すだけで登録完了", "仕事の相手なら、つながりの濃さを押すだけで登録完了")}</div>
      <div class="chips">
        <button class="chip" style="border-color:var(--gold);border-width:2px;font-weight:800"
          onclick="repClsRank('S')">💎 S（${W("太客", "大切な人")}）</button>
        <button class="chip" onclick="repClsRank('A')">A</button>
        <button class="chip" onclick="repClsRank('B')">B（ふつう）</button>
      </div>
      <div style="height:1px;background:var(--border);margin:12px 0"></div>
      <div class="chips">
        <button class="chip" onclick="repInd()">👥 ${W("業界の人", "仕事の人")}</button>
        <button class="chip" onclick="repCls('priv')">🔒 私用(取り込まない)</button>
      </div></div></div>`;
  }
  return `<div class="lbody">${head}${msg}
    <div id="drafts"><div class="skel"></div><div class="skel"></div></div>
    <div class="lfoot">
      <button onclick="repAct('done')">✓ 対応した(送らず記録)</button>
      <button onclick="repWrite()">✎ 自分で書く</button>
    </div></div>`;
}
async function fillDrafts(p, gen) {
  const r = await prefetchReply(p.mid);
  if (gen !== rep.gen) return;   // 展開が変わっていたら破棄(v191#3の世代ガードを継承)

  $("#drafts").innerHTML =
    (r.gen_note ? `<div style="background:#FDF3E0;border:1px solid #E3C98A;border-radius:10px;
       padding:8px 10px;font-size:13px;color:#7A5F1E;margin:0 0 8px">⚠️ ${esc(r.gen_note)}
       <button class="chip" style="padding:4px 10px;min-height:0;font-size:12px;margin-left:6px"
         onclick="repRegen(${p.mid})">🔁 作り直す</button></div>` : "")
    + cardRefChip(r.card_keys)
    + ((r.drafts || []).length ? `<div class="note" style="margin:0 2px 6px">💡 直したい時は文章をタップ</div>` : "")
    + ((r.drafts || []).map((g, j) => draftHtml(j, g.text)).join("")
    || `<div class="note">下書きを作れませんでした。<button class="chip" style="padding:4px 10px;min-height:0;font-size:12px;margin:0 6px"
         onclick="repRegen(${p.mid})">🔁 もう一度つくる</button> 下のボタンで記録だけもできます。</div>`);

window.listOpen = k => {
  if (repLocked()) return;
  snackHide();
  rep.i = (rep.i === k) ? -1 : k;
  drawRep();
  if (rep.i >= 0) setTimeout(() => {
    document.getElementById("lr" + k)?.scrollIntoView({ block: "nearest" }); }, 30);

function lsubHtml(nm, st, undoHtml) {
  return `<div class="lsub"><span class="nm">${esc(disp(nm))}</span>
    <span class="st">${esc(st)}</span>${undoHtml}</div>`;
}
function drawRep() {
  const gen = rep.gen = (rep.gen || 0) + 1;
  document.getElementById("histsheet")?.remove();   // 旧シートの残留保険(v191#5)
  const items = rep.items || [];
  const wrap = items.map((p, k) => ({ p, k }));
  const live = wrap.filter(x => !x.p._done);
  const hot = live.filter(x => !repIsLater(x.p) && repIsHot(x.p));
  const norm = live.filter(x => !repIsLater(x.p) && !repIsHot(x.p));
  const later = live.filter(x => repIsLater(x.p));

  if (ann.step === "resume") {
    v.innerHTML = `<div class="card"><h3 class="sec">前回の配達が ${ann.i + 1}/${ann.q.length}人目 で止まっています</h3>
      <button class="btn primary" onclick="ann.step='run';drawAnn()">続きから</button>
      <button class="btn ghost" onclick="store.del('annq');Object.assign(ann,{step:'purpose',q:[],i:0,sent:0});drawAnn()">最初から選び直す</button></div>`;
    return;
  }
  if (ann.step === "purpose" || ann.step === "seg") {
    setHead(W("📣 配信をつくる", "📣 まとめて連絡"), "目的と相手を選んで開始", true);
    v.innerHTML = `<div class="card"><h3 class="sec">なんの配信？</h3>
      <div class="chips" style="margin:8px 0 6px">${ANN_PURPOSES().map(([k, lab]) =>
        `<button class="chip ${ann.purpose === k ? "on" : ""}"
          onclick="ann.detail=(document.getElementById('annDetail')||{value:ann.detail}).value.trim();ann.purpose='${k}';drawAnn()">${lab}</button>`).join("")}</div>
      <label class="f">伝えたい内容(タップで組み立てもOK。<b>書いた内容は全員の文面に必ず入ります</b>)</label>
      <div class="chips" style="margin-bottom:6px">${["今日", "今週", "来週", "月", "火", "水", "木", "金", "土",
        W("お店に出ます", "ごはん行きませんか"), W("来店お願いしたい", "会いに来てほしいです"),
        W("イベントがあります", "近況のご報告です"), W("同伴できます", "久しぶりに会いたいです")].map(w =>
        `<button class="chip" style="padding:7px 12px;font-size:13px" onclick="annWord(${jarg(w)})">${esc(w)}</button>`).join("")}</div>
      <input class="f" id="annDetail" value="${esc(ann.detail)}" placeholder="例: 今週は金曜と土曜おります">
      <h3 class="sec" style="margin-top:16px">誰に配る？(複数選べます・重複は自動でまとめます)</h3>
      <div class="chips" id="annSegs" style="margin-top:8px"><span class="spin"></span></div>
      <div class="note">${W("同業・店内", "仕事仲間・社内")}は文面のトーンが自動で変わります。配達中も1人ずつスキップ可</div></div>`;
    cached("annseg", "/api/liff/ann/segments", d => {
      if (!d || !$("#annSegs")) return;
      const c = d.counts;
      const segs = [["S", `${W("S客だけ", "大切な人だけ")}(${c.S})`], ["SA", `${W("S+A客", "大切+近しい人")}(${c.S + c.A})`], ["ALL", `${W("全顧客", "全員")}(${c.ALL})`],
        ["GB", `${W("久しぶりの客", "久しぶりの人")}(${c.GB})`], ["RV", `${W("最近来た客", "最近会った人")}(${c.RV})`], ["BD", `誕生日近い(${c.BD})`],
        ["PEER", `${W("同業の仲間", "仕事仲間")}(${c.PEER})`], ["STAFF", `${W("店内の子", "社内・チーム")}(${c.STAFF})`]]
        .filter(([k, lab]) => !lab.includes("(0)"));
      $("#annSegs").innerHTML = (segs.map(([k, lab]) =>
        `<button class="chip" data-seg="${k}">${lab}</button>`).join("")
        || `<div class="note">相手がいません</div>`)
        + `<button class="btn primary" id="annGo" style="margin-top:12px">▶ 配達をはじめる(重複は自動でまとめます)</button>`;
      // v175: addEventListenerは再描画(キャッシュ表示→通信後の再render)のたびに多重登録され、
      // 2回目以降の訪問でトグルが偶数回走って「タップしても選択が付かない」完全な機能停止に
      // なっていた(本人指摘)。onclickプロパティ代入なら常に1本。
      $("#annSegs").onclick = e => {
        const b2 = e.target.closest("[data-seg]"); if (!b2) return;
        b2.classList.toggle("on");
      };
      $("#annGo").onclick = () => {
        const sel = [...$("#annSegs").querySelectorAll(".chip.on")].map(x => x.dataset.seg);
        if (!sel.length) return toast("配る相手のグループを1つ以上タップしてください");
        ann.detail = document.getElementById("annDetail").value.trim();
        annPlan(sel);
      };
    }, 60);
    return;
  }
  if (ann.step === "run") return drawAnnRun();
}
window.annPlan = async segs => {
  if (!Array.isArray(segs)) segs = [segs];
  const v = $("#view"); v.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  let r; try { r = await api("/api/liff/ann/plan", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ segs }) }); }
  catch (e) { v.innerHTML = `<div class="empty">読み込めませんでした</div>`; return; }
  if (!r.items || !r.items.length) { toast("対象の相手がいません"); ann.step = "seg"; drawAnn(); return; }
  if (r.deduped) toast(`重複${r.deduped}件をまとめました(同じ人に二度送りません)`);
  // v192その6: 履歴チップ廃止に伴い履歴保存もやめる(v175の壊れ文フィルタごと不要)
  // v175: 配信下書きキャッシュを全破棄(内容を書き直しても古い内容の下書きが出るバグ)
  Object.keys(draftCache).filter(k => k[0] === "a").forEach(k => delete draftCache[k]);
  // v123(E6): 配達前プレビュー=1人ずつ外せる
  Object.assign(ann, { segs, tone: "cust", q: r.items, i: 0, sent: 0, step: "preview", excl: {} });
  drawAnnPreview();
};

window.annStart = () => {

async function drawAnnRun() {
  window.scrollTo(0, 0);   // v192その4: 配信の次の1人は先頭から(送信ユニット差し替えはswDraw側なのでここは常時安全)
  const n = ann.q.length;
  if (ann.i >= n) {
    store.del("annq"); bust("home");
    $("#view").innerHTML = `<div class="empty" style="font-size:16px">配達する相手は残っていません。${ann.sent}人に送りました。</div>
      <button class="btn ghost" onclick="Object.assign(ann,{step:'purpose',q:[],i:0,sent:0});nav('#home')">ホームへ</button>`;
    setHead("📣 配信", "完了", true); return;
  }
  const p = ann.q[ann.i];
  setHead(`📣 ${ann.i + 1}/${n}｜${disp(p.name)}`,
          `ランク${p.rank}・送信済み${ann.sent}${ann.sent >= 8 ? "(8人超・今夜は打ち止め推奨)" : "/8人目安"}`, true);
  $("#view").innerHTML = `<div class="prog"><i style="width:${ann.i / n * 100}%"></i></div>
    <div id="drafts"><div class="skel"></div></div>
    <div class="actbar"><button onclick="annSkip()">スキップ</button>
      <button onclick="annSave();nav('#home')">中断(続きから再開可)</button></div>`;
  $("#view").classList.add("hasbar");
  const tpl = ann.detail || "";
  ann.q.slice(ann.i + 1, ann.i + 3).forEach(x => prefetchAnn(x.code, x.tone || ann.tone, tpl));  // 先読み
  const cur = p.code;
  const r = await prefetchAnn(cur, p.tone || ann.tone, tpl);
  if (ann.q[ann.i] && ann.q[ann.i].code === cur && $("#drafts")) {
    // v176: 送信ユニット(検索語フィールド+回収レーン)。従来の全文コピー+文章案内を置換
    swSetup("ann", { code: p.code, sname: p.sname, yobina: p.name, tanto: p.tanto,   // v178: disp()は敬称を付けるため検索語ソースに使わない
                     sword: p.sword, common: swCommon(ann.q.map(x => x.sname)) });
    // v160裁定の温存: 宛先名は送るボタンの直前(最後の確認点)
    _swSend["ann"] = annBtns(p);
    $("#drafts").innerHTML =
      cardRefChip(r.card_keys)
      + (r.text ? `<div class="note" style="margin:0 0 4px">📮 宛先: <b style="color:var(--head)" class="plink" data-plink="${encodeURIComponent(p.code)}">${esc(disp(p.name))}</b></div>`
        + `<div class="draft" id="dr0"><div class="t" onclick="repEdit(0)">${esc(r.text)}</div>
           <textarea style="display:none">${esc(r.text)}</textarea>
           ${swUnitHtml("ann", _swSend["ann"])}</div>`
      : `<div class="note">下書きを作れませんでした。スキップして次へ。</div>`);
    // 画面表示と同時に既定語をコピー(送信時にも再コピーする)。ジェスチャ外なので
    // iOSでは失敗し得る→成功した時だけ「✓コピー済」バッジを立てる(client-2)
    copyWord(swWord("ann")).then(ok => {
      const s = SW["ann"];
      if (ok && s && !s.copied) { s.copied = true; swDraw("ann", _swSend["ann"]); }
    });
  }
}
// v177: 配信の送るボタン一式(swunitの送信エリア)。copied確認からの「まだ」でも使うため関数化
function annBtns(p) {
  return `<div class="swstep" style="font-weight:700;color:var(--ink)">📤 ${esc(disp(p.name))}へ送ります</div>
      <button class="btn green" style="margin:0;border-radius:0" onclick="annSend(0)">📤 LINEで送る</button>`;
}
window.annSend = async j => {
  const d = $("#dr" + j), ta = d.querySelector("textarea");
  const orig = ta.defaultValue, text = (ta.style.display === "none" ? orig : ta.value).trim();
  if (!text) return;
  const p = ann.q[ann.i], edited = text !== orig;
  const res = await sendViaLine(text, p.code, p.sname, swWord("ann"));   // v176: ユニットの現在語をコピー
  if (res === "sent") { fire("/api/liff/ann/sent", { code: p.code, text, edited, orig });
    delete draftCache["a" + p.code]; ann.sent += 1; ann.i += 1; annSave();
    toast(`✓ ${disp(p.name)}に送信`); drawAnnRun(); }
  else if (res === "copied") {
    // v177: v176で#dr0の.rowが送信ユニット(swUnitHtml)に置換され、旧 d.querySelector('.row') が
    // nullでTypeError無言クラッシュ→「✓貼り付けて送った」(annMark)の記録経路が消滅していた。
    // .rowに依存せず、swunitの送信エリア(_swSend)を確認UIに差し替えて再描画する。
    // 注意文は琥珀(規約13: 赤は本流エラー専用)
    _swSend["ann"] = `<button class="btn primary" style="margin:0;border-radius:0" onclick="annMark('${esc(p.code)}')">✓「${esc(disp(p.name))}」に貼り付けて送った</button>
      <button class="btn ghost" style="margin:0;border-radius:0" onclick="annStill()">まだ</button>
      <div class="note" style="margin:6px 10px;color:#7A5F1E">⚠️ 貼る前にトークの相手名が「${esc(disp(p.name))}」か確認</div>
      <a class="btn green" style="text-decoration:none;text-align:center" href="line://nv/chat">📱 LINEのトーク一覧を開く</a>`;
    swDraw("ann", _swSend["ann"]);
    d.dataset.text = text;
  }
  else {
    // v177: v175でrepSendに入れた「共有画面を閉じた/SDKが結果を返さない」時の回収UIを配信にも適用。
    // いままでは無言で何も起きず、二重送信か記録漏れを誘っていた。
    _swSend["ann"] = `<button class="btn primary" style="margin:0;border-radius:0" onclick="annMark('${esc(p.code)}')">✓ もう送った(記録する)</button>
      <button class="btn ghost" style="margin:0;border-radius:0" onclick="annSend(${j})">↻ もう一度</button>`;
    swDraw("ann", _swSend["ann"]);
    d.dataset.text = text;
    toast("送信を確認できませんでした。送っていたら「もう送った」を押してください");
  }
};
window.annStill = () => {   // 「まだ」= 編集中の本文に触れず、送るボタンだけ元に戻す
  const p = ann.q[ann.i]; if (!p) return;
  _swSend["ann"] = annBtns(p);

window.annWord = w => {
  const el = document.getElementById("annDetail");
  if (!el) return;
  let cur = el.value.trim();
  if (["月", "火", "水", "木", "金", "土"].includes(w)) w = w + "曜";
  // v162→v175: 旧ガードは「直前の1語」しか見ておらず、間に別の語を挟むと同じ語を何度でも
  // 追記できて「今週は今週は来週は…」が量産されていた。文全体での重複を禁止する。
  if (cur && cur.includes(w)) { toast(`「${w}」はすでに入っています`); return; }
  if (cur && !/[、。 ]$/.test(cur) && !cur.endsWith("週")) cur += (w.endsWith("曜") && /曜$/.test(cur) ? "と" : "、");
  if (/週$/.test(cur.trim()) ) cur = cur.replace(/週$/, "週は");
  el.value = (cur + w).replace(/曜と曜/, "曜");
  ann.detail = el.value;

    <div class="card">
      <div style="font-size:21px;font-weight:800;line-height:1.3">${esc(disp(it.name))}
        <span style="font-size:12px;font-weight:700;color:var(--red);margin-left:6px;vertical-align:2px">未確定: ${esc(it.missing.join("・"))}</span></div>
      ${it.last_text ? `<div style="background:var(--cream);border-radius:9px;padding:7px 10px;font-size:12px;
        color:var(--sub);margin:7px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">「${esc(it.last_text)}」</div>` : ""}
      <div class="note" style="margin:8px 0 4px">会話から取れた候補は入力済み。確認して確定するだけ</div>
      <div class="note" style="margin:0 0 8px;color:var(--gold)">🔒 会話から読み取った情報は、この確定のあとにカードへ入ります(それまで安全におあずけ)</div>
      <label class="f">呼び名 <span style="color:var(--red)">*</span></label>
      <input class="f" id="fxYb" value="${esc(sg["呼び名"] || "")}">
      ${sg["呼び名"] ? "" : `<button class="chip" style="margin-top:6px"
        onclick="document.getElementById('fxYb').value=${JSON.stringify(it.code).replace(/"/g, '&quot;')}">「${esc(it.code)}」のまま使う</button>`}
      <label class="f">本名（分かれば）</label>
      <input class="f" id="fxHn" value="${esc(sg["本名"] || "")}">
      ${(!sg["本名"] && sg["本名候補"]) ? `<button class="chip" style="margin-top:6px"
        onclick="document.getElementById('fxHn').value=${JSON.stringify(sg["本名候補"]).replace(/"/g, '&quot;')}">
        「${esc(sg["本名候補"])}」を本名として使う</button>` : ""}
      <label class="f">誕生日(分かれば)</label>
      <input class="f" id="fxBd" value="${esc(sg["誕生日"] || "")}" placeholder="8月19日">
      <label class="f">種別 <span style="color:var(--red)">*</span></label>
      <div class="chips" id="fxKind">${kindChip("customer", W("顧客", "仕事の相手"))}${kindChip("staff", W("店内(自店)", "社内・チーム"))}
        ${kindChip("peer", W("同業・他店", "仕事仲間・社外"))}${kindChip("priv", "私用(データごと削除)")}</div>
      <div id="fxBelongBox" style="display:${sg.kind === "peer" ? "block" : "none"}">
        <label class="f">所属(店名・会社など)</label><input class="f" id="fxBelong" placeholder="例: 〇〇(六本木のクラブ)"></div>
      <label class="f">立場 <span style="color:var(--red)">*</span></label>
      <div class="chips" id="fxStand">${standChip("up", "先輩・目上")}${standChip("even", "対等")}${standChip("down", "後輩・目下")}</div>
      <label class="f">ランク <span style="color:var(--red)">*</span></label>
      <div class="chips" id="fxRank">${["S", "A", "B"].map(v => `<button class="chip ${(it.rank || "B") === v ? "on" : ""}" data-rank="${v}">${v === "S" ? W("S(太客)", "S(最重要)") : v === "A" ? "A" : W("B(ふつう)", "B(ふつう)")}</button>`).join("")}</div>
      <button class="btn primary" id="fxSave">確定して次へ</button>
      <button class="btn ghost" onclick="fx.i+=1;drawFixup()">あとで(スキップ)</button></div>` + bulkBtn;
  const sel = { kind: sg.kind || "", stand: sg.stand || "", rank: it.rank || "B" };   // v182: ランクも3連の一角
  $("#fxKind").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return;
    $("#fxKind").querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); sel.kind = b.dataset.kind;
    $("#fxBelongBox").style.display = sel.kind === "peer" ? "block" : "none"; });
  $("#fxStand").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return;
    $("#fxStand").querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); sel.stand = b.dataset.stand; });
  $("#fxRank").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return;
    $("#fxRank").querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); sel.rank = b.dataset.rank; });
  $("#fxSave").onclick = async () => {
    const body = { code: it.code, "呼び名": $("#fxYb").value.trim(), "本名": $("#fxHn").value.trim(),
      "誕生日": $("#fxBd").value.trim(), kind: sel.kind, stand: sel.stand, rank: sel.rank,
      "所属": ($("#fxBelong") || { value: "" }).value.trim() };
    if (body.kind !== "priv" && (!body["呼び名"] || !body.kind || !body.stand || !body.rank))
      return toast("呼び名・種別・立場・ランクは必須です(候補ボタンで1タップ入力できます)");
    if (body.kind === "priv") {   // v150: ネイティブconfirm廃止(iOSのドメイン名入りダイアログ問題)
      const ok = await askDanger(`${disp(it.name)}を私用にする`,
        "この人からの受信は今後取り込まれず、いままでの受信も消えます。");
      if (!ok) return toast("やめました");
    }
    $("#fxSave").textContent = "保存中…";
    try {
      const r = await api("/api/liff/fixup/save", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error(r.error || "");
      store.del("card_" + it.code);
      fx.i += 1; drawFixup();
    } catch (e) { $("#fxSave").textContent = "確定して次へ"; toast(e.message || "保存できませんでした"); }
  };
}

// ============ 📡 受信係の接続(v102: QRプロビジョニング・端末管理) ============
async function vReader() {
  setHead("📡 受信係", "受信端末の接続と状態", true);
  $("#view").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  let d; try { d = await api("/api/liff/reader/status"); } catch (e) {
    $("#view").innerHTML = `<div class="empty">読み込めませんでした</div>`; return; }
  const w = d.watch || {};
  const st = w.last_ts == null ? `<span class="stat-ng">―(まだ受信なし)</span>`
    : w.ok ? `<span class="stat-ok">✅ 正常(${w.gap_hours}時間前に生存確認)</span>`
    : `<span class="stat-ng">⚠️ ${w.gap_hours}時間 無音</span>`;
  const readers = (d.readers || []).filter(r => !r.revoked);
  $("#view").innerHTML = `
    <div class="card"><h3 class="sec">状態</h3>${st}
      <div class="note">${esc(w.note || "")}</div></div>
    <div class="card"><h3 class="sec">つながっている端末</h3>
      ${readers.length ? readers.map(r => `
        <div class="kv"><div class="k">${esc(r.label)}</div>
          <div class="v">${r.last_seen ? Math.round((Date.now()/1000 - r.last_seen)/60) + "分前に通信" : "未通信"}
          ${r.battery ? "・電池" + esc(r.battery) + "%" : ""}
          <div><button class="chip" style="margin-top:6px;color:var(--red)"
            onclick="readerRevoke(${r.id})">この端末を切断</button></div></div></div>`).join("")
        : `<div class="note">v0.5端末はまだ接続されていません(旧リーダーは表示されません)</div>`}
    </div>
    ${d.remote ? `<div class="card"><h3 class="sec">🎛 遠隔操作(v0.6.1端末)</h3>
      <div class="kv"><div class="k">端末側の状態</div><div class="v">
        ${d.remote.ver ? "v" + esc(d.remote.ver) : "旧バージョン(情報なし)"}
        ${d.remote.q !== "" ? "・未送信" + esc(d.remote.q) + "件" : ""}
        ${d.remote.pending_cmd ? `<div style="color:var(--gold)">⏳ 命令「${esc(d.remote.pending_cmd)}」を次の生存信号で実行(最大15分)</div>` : ""}</div></div>
      <div class="chips" style="margin-top:6px">
        <button class="chip" onclick="readerCmd('flush')">📤 今すぐ送らせる</button>
        <button class="chip" onclick="readerCmd('diag')">🩺 診断を送らせる</button>
        <button class="chip" style="color:var(--red)" onclick="readerCmd('clearq')">🧹 未送信を破棄</button></div>
      ${d.remote.diag ? `<div class="quote" style="margin-top:8px;white-space:pre-wrap">🩺 ${new Date(d.remote.diag.ts * 1000).toLocaleString("ja-JP")}
${esc(d.remote.diag.text)}</div>` : ""}
      <div class="note" style="margin-top:6px">命令は端末の15分ごとの生存信号に載って届きます(即時ではありません)</div></div>` : ""}
    <button class="btn primary" onclick="readerQr()">📱 新しい端末をつなぐ(QR表示)</button>
    <div id="qrbox"></div>
    <div class="note">リーダー端末のアプリで「QRをスキャン」するだけ。カメラが使えない時は、
    アプリに帳場の玄関パスワードを入れれば自動でこのサーバーを見つけます。</div>`;
}
window.readerCmd = async cmd => {
  if (cmd === "clearq") {
    const ok = await askDanger("未送信キューを全部捨てる",
      "受信用スマホに溜まっている未送信メッセージが失われます。");
    if (!ok) return toast("やめました");
  }
  try {
    const r = await api("/api/liff/reader/cmd", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cmd }) });
    if (r.error) return toast(r.error);
    toast("✓ 予約しました(次の生存信号で実行・最大15分)"); vReader();
  } catch (e) { toast("予約できませんでした"); }
};
window.readerQr = async () => {
  let r; try { r = await api("/api/liff/reader/code", { method: "POST" }); }
  catch (e) { return toast("発行できませんでした"); }
  const payload = JSON.stringify({ u: location.origin, c: r.code });
  const host = location.host;
  $("#qrbox").innerHTML = `<div class="card" style="text-align:center">
    <div style="font-size:13px;color:var(--red);font-weight:700;margin-bottom:8px">
      ⚠️ これは <u>${esc(host)}</u> の接続QRです<br>この人の端末で読んでいるか確認してください</div>
    <div id="qrimg" style="display:inline-block;background:#fff;padding:12px"></div>
    <div style="font-size:20px;font-weight:700;letter-spacing:3px;margin-top:8px">${esc(r.code)}</div>
    <div class="note">10分間・1回だけ有効。リーダー端末でスキャン(または手動ならこのコードとパスワード)</div></div>`;
  new QRCode(document.getElementById("qrimg"), { text: payload, width: 200, height: 200 });
};
window.readerRevoke = async id => {
  try { await api("/api/liff/reader/revoke", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    toast("切断しました(そのトークンは無効化)"); vReader(); }
  catch (e) { toast("失敗しました"); }
};

boot();
</script>
</body>
</html>
